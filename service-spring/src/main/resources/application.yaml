spring:
  application:
    name: @project.artifactId@
    version: @project.version@
    tag: jeanbarcellos

  datasource:
    url: jdbc:h2:mem:testdb
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true

  jackson:
    default-property-inclusion: non-null
    serialization:
      order-map-entries-by-keys: false
    mapper:
      sort-properties-alphabetically: false


logging:
  level:
    "org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver": ERROR


api:
  problem:
    base-uri: http://localhost:8080/problems


core:
  observability:
    enabled: true
    correlation-header: correlation-id
    correlation-required: false
    response-header-enabled: true

